# Mosquitto broker for the local streaming simulation (demo only).
# Mosquitto 2 listens on localhost only and rejects anonymous clients by
# default, which would make the broker unreachable from outside the
# container, so both are opened up here. Do not reuse outside a dev box.
listener 1883 0.0.0.0
allow_anonymous true

# Keep queued QoS 1 messages for the consumer's persistent session across
# broker restarts, and raise the per-client queue limit (default 1000) so a
# consumer that is down for a while does not lose telemetry.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 100000

# The consumer acks each message only after its SQLite commit, so up to a
# full micro-batch is unacknowledged at once. The default of 20 in-flight
# QoS 1 messages per client would cap every batch at 20 readings.
max_inflight_messages 1000

log_dest stdout
